name: Publish Docs

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  deploy:
    name: Deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build docs
        uses: devcontainers/ci@v0.3
        with:
          push: never
          runCmd: /bin/bash -c "npm run build"

      - name: Remove node_modules
        # node_modules is owned by root because the build above runs inside
        # so we need to delete it before using cloudflare/wrangler-action
        run: sudo rm -rf ./node_modules

      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          command: pages deploy ./docs/dist --project-name=varavel-vdl-plugin-sdk
